<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="preview-title preview-desc">
  <title id="preview-title">SovChat for Omarchy</title>
  <desc id="preview-desc">Promotional artwork for SovChat's Omarchy bar widget and dedicated desktop client, highlighting voice rooms, text chat, compact mode, and screen or application sharing.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="20" x2="1500" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20383B"/>
      <stop offset="0.54" stop-color="#1D2E31"/>
      <stop offset="1" stop-color="#172629"/>
    </linearGradient>
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientTransform="translate(1240 375) rotate(90) scale(390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44D0D5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#44D0D5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellow-glow" cx="0" cy="0" r="1" gradientTransform="translate(280 760) rotate(-25) scale(390 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCA2A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFCA2A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#B1C0C3" stroke-width="1" opacity="0.075"/>
    </pattern>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#071214" flood-opacity="0.42"/>
    </filter>
  </defs>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="-104 -104 208 208">
  <defs>
    <path id="arm" d="M0 0V-8 M-2.5-7 0-4.5 2.5-7" />
    <g id="flake" fill="none" stroke="#bdeef5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <use href="#arm" />
      <use href="#arm" transform="rotate(60)" />
      <use href="#arm" transform="rotate(120)" />
      <use href="#arm" transform="rotate(180)" />
      <use href="#arm" transform="rotate(240)" />
      <use href="#arm" transform="rotate(300)" />
    </g>
    <g id="sector">
      <use href="#flake" transform="translate(0 -94)" />
      <use href="#flake" transform="rotate(30) translate(0 -94) scale(.72)" opacity=".8" />
      <g fill="#a1e6e9" opacity=".7">
        <circle cy="-94" r="1.2" transform="rotate(15)" />
        <circle cy="-94" r="1.2" transform="rotate(45)" />
      </g>
    </g>
  </defs>
  <use href="#sector" />
  <use href="#sector" transform="rotate(60)" />
  <use href="#sector" transform="rotate(120)" />
  <use href="#sector" transform="rotate(180)" />
  <use href="#sector" transform="rotate(240)" />
  <use href="#sector" transform="rotate(300)" />
</svg>
